# pnpm 11 reads its settings from this file, not from .npmrc (and no longer from
# the `pnpm` field in package.json).
#
# nodeLinker: pnpm's default "isolated" layout nests every package as
#   node_modules/.pnpm/<pkg>@<64-char-hash>/node_modules/<pkg>
# which pushes CMake/Ninja object paths for react-native-worklets and friends
# past Windows' 250-character limit. The native build then fails with
#   ninja: error: manifest 'build.ninja' still dirty after 100 tries
# The hoisted (npm-style) layout keeps those object paths at ~127 characters.
nodeLinker: hoisted

# Build-script policy. Entries were already approved for the CometChat
# dependency tree; the @firebase/* and protobufjs lines cover the push
# dependencies added later (both are plain JS with no native step).
allowBuilds:
  '@clerk/shared': true
  '@firebase/util': true
  browser-tabs-lock: true
  bufferutil: true
  core-js: true
  lib-jitsi-meet@https://dl.cloudsmith.io/public/cometchat/cometchat/raw/files/cometchat-calls-lib-webrtc-346a46ff.tgz: true
  strophejs-plugin-stream-management@https://codeload.github.com/jitsi/strophejs-plugin-stream-management/tar.gz/679be5902097ed612fb5062b5549f3f32b6f5f47: true
  unrs-resolver: true
  utf-8-validate: true
  protobufjs: true
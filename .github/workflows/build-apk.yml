name: Build Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.0

      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Init EAS project
        run: eas init --account preetb --non-interactive

      - name: Configure EAS secrets
        run: |
          eas env:set --name EXPO_PUBLIC_SERVER_URL --value "${{ secrets.EXPO_PUBLIC_SERVER_URL }}" --visibility plaintext --force
          eas env:set --name EXPO_PUBLIC_ONESIGNAL_APP_ID --value "${{ secrets.EXPO_PUBLIC_ONESIGNAL_APP_ID }}" --visibility plaintext --force
          eas env:set --name ONESIGNAL_APP_ID --value "${{ secrets.ONESIGNAL_APP_ID }}" --visibility plaintext --force
          eas env:set --name ONESIGNAL_REST_API_KEY --value "${{ secrets.ONESIGNAL_REST_API_KEY }}" --visibility sensitive --force
          eas env:set --name LIVEKIT_URL --value "${{ secrets.LIVEKIT_URL }}" --visibility plaintext --force
          eas env:set --name LIVEKIT_API_KEY --value "${{ secrets.LIVEKIT_API_KEY }}" --visibility sensitive --force
          eas env:set --name LIVEKIT_API_SECRET --value "${{ secrets.LIVEKIT_API_SECRET }}" --visibility sensitive --force
          eas env:set --name JWT_SECRET --value "${{ secrets.JWT_SECRET }}" --visibility sensitive --force
          eas env:set --name MONGODB_URI --value "${{ secrets.MONGODB_URI }}" --visibility sensitive --force
          eas env:set --name CORS_ORIGIN --value "${{ secrets.CORS_ORIGIN }}" --visibility plaintext --force

      - name: Build APK
        run: eas build --profile production --platform android --non-interactive

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: veill-apk
          path: |
            *.apk
            *.aab
          retention-days: 30

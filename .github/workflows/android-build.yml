name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 27.1.12297006
          build-tools-version: 35.0.0
      
      - name: Configure gradle.properties
        run: |
          mkdir -p android
          cat > android/gradle.properties << EOF
          org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
          org.gradle.parallel=true
          android.useAndroidX=true
          android.enablePngCrunchInReleaseBuilds=true
          reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
          newArchEnabled=false
          hermesEnabled=true
          edgeToEdgeEnabled=true
          react.native.autoLinkLibrariesAndroidEnabled=false
          EOF
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      
      - name: Create autolinking config
        run: |
          mkdir -p android/build/generated/autolinking
          echo '{}' > android/build/generated/autolinking/autolinking.json
      
      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon
        shell: bash
      
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: android/build/reports/
          retention-days: 7
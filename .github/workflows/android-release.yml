name: Android Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  NODE_ENV: production

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Remove expo-dev-client for release build
        run: pnpm remove expo-dev-client

      - name: Check and fix Babel config
        run: |
          if [ -f babel.config.js ]; then
            echo "Found babel.config.js"
            head -20 babel.config.js
          fi
          if [ -f .babelrc ]; then
            echo "Found .babelrc"
            cat .babelrc
          fi
          if [ -f .babelrc.json ]; then
            echo "Found .babelrc.json"
            cat .babelrc.json
          fi

      - name: Patch expo-router bundle root
        run: |
          export ROUTER_ENTRY="node_modules/expo-router/entry.js"
          if [ -f "$ROUTER_ENTRY" ]; then
            sed -i "s|require.*EXPO_ROUTER_APP_ROOT|'./app/index'|g" "$ROUTER_ENTRY" || true
            echo "Patched expo-router entry"
          fi

      - name: Patch expo-modules-core for RN 0.76 compatibility
        run: |
          find node_modules -type f -name "ReactNativeFeatureFlags.kt" -exec sed -i 's/enableBridgelessArchitecture()/false/g' {} + 2>/dev/null || true
          find node_modules -type f -name "CSSProps.kt" -exec sed -i 's/BoxShadow.parse(shadows.getMap(i), view.context)/BoxShadow.parse(shadows.getMap(i))/g' {} + 2>/dev/null || true

      - name: Clean Metro cache
        run: |
          rm -rf /tmp/metro-* 2>/dev/null || true
          rm -rf ~/Library/Developer/Xcode/DerivedData 2>/dev/null || true

      - name: Verify Babel dependencies
        run: |
          echo "=== Checking Babel plugins ==="
          pnpm list @babel/plugin-transform-class-properties @babel/plugin-transform-private-methods @babel/plugin-transform-private-property-in-object babel-plugin-transform-define @babel/core
          echo ""
          echo "=== Babel core version ==="
          pnpm list @babel/core

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release AAB (capture full output)
        run: |
          pwd
          ls -la
          ls -la android/ || true
          find android/ -maxdepth 2 -type f | head -30 || true
          cd android
          ls -la
          ls -la gradlew || true
          EXPO_ROUTER_APP_ROOT=app NODE_ENV=production ./gradlew bundleRelease --stacktrace -v 2>&1 | tee build.log
        timeout-minutes: 30

      - name: Show build output if failed
        if: failure()
        run: |
          echo "=== Grep for errors ==="
          grep -i "error" android/build.log | head -50 || echo "No error lines found"
          echo ""
          echo "=== Grep for SyntaxError ==="
          grep -i "syntaxerror\|cannot find module" android/build.log | head -20 || echo "No syntax errors found"
          echo ""
          echo "=== Metro bundler output ==="
          grep -A 20 "Metro Bundler\|Android Bundling" android/build.log || echo "No Metro output found"

      - name: Download bundletool
        run: |
          mkdir -p tools
          curl -L -o tools/bundletool.jar https://github.com/google/bundletool/releases/download/1.15.0/bundletool-all-1.15.0.jar

      - name: Convert AAB to universal APK
        run: |
          java -jar tools/bundletool.jar build-apks \
            --bundle=android/app/build/outputs/bundle/release/app-release.aab \
            --output=android/app/build/outputs/apk/release/app-release.apks \
            --mode=universal

      - name: Extract APK from APKS
        run: |
          cd android/app/build/outputs/apk/release
          unzip -o app-release.apks universal.apk
          mv universal.apk app-release.apk
          ls -lh app-release.apk

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-builds
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          echo "## Build Status" >> $GITHUB_STEP_SUMMARY
          if [ ${{ job.status }} = 'success' ]; then
            echo "✅ Android release build completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "📦 **Artifacts:**" >> $GITHUB_STEP_SUMMARY
            echo "- **AAB** (for Google Play Store): app-release.aab" >> $GITHUB_STEP_SUMMARY
            echo "- **APK** (for mobile installation): app-release.apk" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Download from:** Artifacts section" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Build failed" >> $GITHUB_STEP_SUMMARY
          fi
name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verify pnpm
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Remove dev-client for release build
        run: pnpm remove expo-dev-client

      - name: Patch expo-router for CI bundling
        run: |
          find node_modules -path "*expo-router*_ctx.*.js" -exec sed -i "s/process.env.EXPO_ROUTER_APP_ROOT/'app'/g" {} +
          find node_modules -path "*expo-router*_ctx.*.js" -exec sed -i "s/process.env.EXPO_ROUTER_IMPORT_MODE/'sync'/g" {} +

      - name: Patch expo-modules-core for RN 0.76 compatibility
        run: |
          find node_modules -path "*expo-modules-core*ReactNativeFeatureFlags.kt" -exec sed -i 's/val enableBridgelessArchitecture = ReactNativeFeatureFlags.enableBridgelessArchitecture()/val enableBridgelessArchitecture = false/' {} +
          find node_modules -path "*expo-modules-core*CSSProps.kt" -exec sed -i 's/BoxShadow.parse(shadows.getMap(i), view.context)/BoxShadow.parse(shadows.getMap(i))/' {} +

      - name: Build release AAB
        run: chmod +x android/gradlew && cd android && EXPO_ROUTER_APP_ROOT=app ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
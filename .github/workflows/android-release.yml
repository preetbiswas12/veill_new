name: Android Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # ✅ Changed from 24
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile  # ✅ Changed from --no-frozen-lockfile

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release AAB
        run: |
          cd android
          
          # Create local.properties
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi
          
          # Build with verbose output
          ./gradlew :app:bundleRelease \
            --stacktrace \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseG1GC"

      - name: Upload AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Show error logs
        if: failure()
        run: |
          cd android
          cat build.log 2>/dev/null || ./gradlew :app:bundleRelease --stacktrace 2>&1 | tail -100
# Gradle Configuration for React Native 0.73.6

# JVM Memory Settings (CRITICAL)
org.gradle.jvmargs=-Xmx4096m -XX:+UseG1GC -XX:MaxGCPauseMillis=1000
org.gradle.java.version=17

# Kotlin Settings
kotlin.incremental=true
kotlin.stdlib.default.enabled=true
org.gradle.kotlin.dsl.skipMetadataVersionCheck=true

# Gradle Settings
org.gradle.warning.mode=all
android.suppressUnsupportedCompileSdk=true

# AndroidX & Jetifier (REQUIRED for CometChat + Daily.co)
android.useAndroidX=true
android.enableJetifier=true

# New Architecture Disabled
newArchEnabled=false

# Gradle Performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.caching=true

# Hermes Engine (fast JS)
hermesEnabled=true

# Minification
android.enableR8.fullMode=true

# React Native Release Level
reactNativeReleaseLevel=stable

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  dependencies {
    classpath("com.android.tools.build:gradle:8.7.3")
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
  }
}

ext {
  buildToolsVersion = "34.0.0"
  minSdkVersion = 24
  compileSdkVersion = 34
  targetSdkVersion = 34
  ndkVersion = "27.0.11929286"
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }

  // Inject AGP and Kotlin into every subproject's buildscript classpath.
  // This ensures third-party libraries that declare their own buildscript
  // blocks (e.g. CometChat with AGP 4.2.0) use the same versions as the
  // root project instead of conflicting old versions.
  afterEvaluate { project ->
    if (project.buildscript.file) {
      project.buildscript.repositories {
        google()
        mavenCentral()
      }
      project.buildscript.dependencies.add("classpath", "com.android.tools.build:gradle:8.7.3")
      project.buildscript.dependencies.add("classpath", "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24")
    }
  }
}

// Top-level build file where you can add configuration options common to all sub-projects/modules.

ext {
  buildToolsVersion = "34.0.0"
  minSdkVersion = 24
  compileSdkVersion = 34
  targetSdkVersion = 34
  ndkVersion = "27.0.11929286"
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}
